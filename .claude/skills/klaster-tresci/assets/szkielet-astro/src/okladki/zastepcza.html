<!doctype html>
<!-- Okładka ZASTĘPCZA szkieletu: neutralna, tylko żeby podgląd nie miał pustych obrazków przed wyborem okładek.
     Po wyborze okładek (references/wybory.md) zastąp ją szablonem marki. -->
<html lang="pl"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html{font-size:calc({{width}}px / 100)}
body{width:{{width}}px;height:{{height}}px;overflow:hidden;background:#e9e9e9;color:#333;font-family:system-ui,-apple-system,Arial,sans-serif;
  display:flex;flex-direction:column;justify-content:center;gap:2rem;padding:0 7rem;background-image:repeating-linear-gradient(45deg,transparent 0 2rem,rgba(0,0,0,.03) 2rem 4rem)}
p{font-size:1.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#777}
h1{font-size:4.6rem;line-height:1.1;font-weight:800;max-width:80%;text-wrap:balance}
b{font-size:7rem;font-weight:900}
</style></head><body data-format="{{format}}"><p>{{kicker}} · okładka zastępcza</p><b>{{big}}</b><h1>{{title}}</h1></body></html>
